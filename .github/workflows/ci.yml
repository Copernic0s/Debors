name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frontend dependencies
        run: npm ci
      - name: Test frontend
        run: npm run test:run
      - name: Build frontend
        run: npm run build
      - name: Install server dependencies
        run: npm ci
        working-directory: server
      - name: Test server
        run: npm test
        working-directory: server
      - name: Test CMP automation helpers
        run: python -m unittest discover -s automation -p 'test_cmp_*.py'
